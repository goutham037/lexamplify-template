# Netlify config for the Lexamplify template.
# Netlify (and Cloudflare Pages) brotli-compress assets at the edge, so the ~30 MB WordCraft
# .wasm transfers as ~7 MB with the browser decompressing it natively — no client-side decoder.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Make sure the WASM is served with the right type (needed for streaming instantiation) and
# cached hard (its filename is content-hashed, so it can cache forever).
[[headers]]
  for = "/wordcraft/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/wordcraft/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
