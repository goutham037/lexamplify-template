<!DOCTYPE html>
<html lang="en">
<head>

  <title>Lexamplify Draft</title>
  <link rel="icon" href="./wordcraft-fa59e09a3f921e03.ico"/>

<script type="module">
import init, * as bindings from './wordcraft-web-1267c095578df488.js';

const WASM = './wordcraft-web-7c35ad8787567460_bg.wasm';

// GitHub Pages serves .wasm uncompressed. Fetch the pre-gzipped copy and inflate it in the
// browser (DecompressionStream) so the download is ~13 MB instead of ~30 MB. Fall back to the
// plain .wasm if the browser lacks DecompressionStream or the .gz is unavailable.
async function wasmSource() {
  try {
    if (typeof DecompressionStream === 'function') {
      const r = await fetch(WASM + '.gz');
      if (r.ok && r.body) {
        const stream = r.body.pipeThrough(new DecompressionStream('gzip'));
        return await new Response(stream).arrayBuffer();
      }
    }
  } catch (e) { /* fall back to the plain wasm */ }
  return WASM;
}

const wasm = await init({ module_or_path: await wasmSource() });
window.wasmBindings = bindings;
dispatchEvent(new CustomEvent("TrunkApplicationStarted", { detail: { wasm } }));
</script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f4f5f7; }

    #wordcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #64748b; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
